[package]
name = "oidc-userinfo"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "=4.5.13", features = ["derive"] }
openidconnect = { git = "https://github.com/rustdesk-org/openidconnect-rs", rev = "3733415b1685bc93bbf1098bf7de164ae12b9c3a", default-features = false, features = ["reqwest", "reqwest-blocking", "rustls-tls", "accept-string-booleans"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde-value = "0.7"

[profile.release]
strip = true

[workspace]

name: Rust

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: build_ci
        type: string
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.84.1"
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag || 'build_ci' }}

jobs:
  windows:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    # Temporarily disable this action due to additional test is needed.
    # if: false
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-pc-windows-msvc, os: windows-2022, arch: x86_64 }
          - { target: i686-pc-windows-msvc, os: windows-2022, arch: x86 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, arch: aarch64 }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Build
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^[A-Za-z0-9._+-]+$') {
            throw "Release tag is not safe for artifact filenames: $env:RELEASE_TAG"
          }
          $packageName = "$($env:RELEASE_TAG)-debug-win-${{ matrix.job.arch }}"
          cargo build --locked --target "${{ matrix.job.target }}"
          New-Item -ItemType Directory -Path $packageName | Out-Null
          Move-Item "./target/${{ matrix.job.target }}/debug/simple_test.exe" $packageName
          Move-Item "./target/${{ matrix.job.target }}/debug/simple_test.pdb" $packageName
          Compress-Archive -Path $packageName -DestinationPath "$packageName.zip"
          $hash = (Get-FileHash "$packageName.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content "$packageName.zip.sha256" -Encoding ascii

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./${{ env.RELEASE_TAG }}-debug-win-${{ matrix.job.arch }}.zip
            ./${{ env.RELEASE_TAG }}-debug-win-${{ matrix.job.arch }}.zip.sha256

  linux:
    name: ${{ matrix.job.target }} / ${{ matrix.job.features }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    # Temporarily disable this action due to additional test is needed.
    # if: false
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, arch: x86_64, features: native-tls, name: "" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, arch: x86_64, features: rustls, name: rustls }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, arch: aarch64, features: native-tls, name: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, arch: aarch64, features: rustls, name: rustls }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Install native-tls dependencies
        if: matrix.job.features == 'native-tls'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev pkg-config

      - name: Build
        id: package
        env:
          BUILD_FEATURES: ${{ matrix.job.features }}
          BUILD_NAME: ${{ matrix.job.name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Release tag is not safe for artifact filenames: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$BUILD_NAME" && ! "$BUILD_NAME" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Build name is not safe for artifact filenames: $BUILD_NAME" >&2
            exit 1
          fi
          name_segment=""
          if [[ -n "$BUILD_NAME" ]]; then
            name_segment="-$BUILD_NAME"
          fi
          package_name="${RELEASE_TAG}${name_segment}-debug-linux-${{ matrix.job.arch }}"
          cargo build --locked --target "${{ matrix.job.target }}" --no-default-features --features "$BUILD_FEATURES"
          mkdir -p "$package_name"
          mv "./target/${{ matrix.job.target }}/debug/simple_test" "$package_name/simple_test"
          tar -czf "$package_name.tar.gz" "$package_name"
          sha256sum "$package_name.tar.gz" > "$package_name.tar.gz.sha256"
          echo "archive=$package_name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$package_name.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./${{ steps.package.outputs.archive }}
            ./${{ steps.package.outputs.checksum }}

  macos:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-15, arch: aarch64 }
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x86_64 }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Build
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Release tag is not safe for artifact filenames: $RELEASE_TAG" >&2
            exit 1
          fi
          package_name="${RELEASE_TAG}-debug-macos-${{ matrix.job.arch }}"
          cargo build --locked --target "${{ matrix.job.target }}"
          mkdir -p "$package_name"
          mv "./target/${{ matrix.job.target }}/debug/simple_test" "$package_name/simple_test"
          tar -czf "$package_name.tar.gz" "$package_name"
          shasum -a 256 "$package_name.tar.gz" > "$package_name.tar.gz.sha256"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./${{ env.RELEASE_TAG }}-debug-macos-${{ matrix.job.arch }}.tar.gz
            ./${{ env.RELEASE_TAG }}-debug-macos-${{ matrix.job.arch }}.tar.gz.sha256

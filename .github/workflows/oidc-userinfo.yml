name: OIDC UserInfo diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["test-oidc-userinfo-*"]
    paths:
      - "oidc-userinfo/**"
      - ".github/workflows/oidc-userinfo.yml"
  pull_request:
    paths:
      - "oidc-userinfo/**"
      - ".github/workflows/oidc-userinfo.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  OIDC_BUILD_SHA: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: windows-x64 }
          - { os: windows-11-arm, platform: windows-arm64 }
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: macos-15, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x64 }
    defaults:
      run:
        shell: bash
        working-directory: oidc-userinfo
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.84.1"
          components: rustfmt
      - name: Check and compile tests
        run: |
          cargo fmt --check
          cargo test --locked --no-run
      - name: Run focused tests with a 60-second timeout
        run: |
          python - <<'PY'
          import subprocess
          subprocess.run(["cargo", "test", "--locked"], check=True, timeout=60)
          PY
      - name: Build
        run: cargo build --locked --release
      - name: Package binary and instructions
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          name = "oidc-userinfo-" + os.environ["PLATFORM"]
          windows = os.name == "nt"
          binary = "oidc-userinfo.exe" if windows else "oidc-userinfo"
          files = [(Path("target/release") / binary, binary), (Path("README.md"), "README.md")]
          Path("dist").mkdir()
          archive = Path("dist") / (name + (".zip" if windows else ".tar.gz"))
          if windows:
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as package:
                  for source, destination in files:
                      package.write(source, name + "/" + destination)
          else:
              with tarfile.open(archive, "w:gz") as package:
                  for source, destination in files:
                      package.add(source, arcname=name + "/" + destination)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(digest + "  " + archive.name + "\n", encoding="ascii")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-userinfo-${{ matrix.platform }}
          path: oidc-userinfo/dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test-oidc-userinfo-')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oidc-userinfo-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Standalone OIDC UserInfo diagnostic. Download the archive for your platform and follow its README.
            Reports include the build commit and redact tokens, credentials and user claim values.
            Share only the report file, not the browser authorization URL or terminal transcript.
